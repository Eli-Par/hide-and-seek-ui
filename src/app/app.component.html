@if(stopLoaded) {
  <app-map-view />
}
@else {
  <div class="container">
    <input type="file" #fileInput style="display: none"
      (change)="fileUploaded(fileInput.files?.[0]); fileInput.value = ''" />
    
    <div>Select a generated data json to load your regions data</div>
    <button (click)="fileInput.click()" class="primary">Upload Data File</button>
  </div>
}
